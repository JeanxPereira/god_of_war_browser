name: Build and Deploy
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    env:
      GOPATH: C:\gopath
      GOARCH: 386
      GOOS: windows
      CGO_ENABLED: 0
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.20'
    
    - name: Set up environment
      run: |
        echo $env:PATH
        echo $env:GOPATH
        $env:PATH = "$env:GOPATH\bin;C:\go\bin;$env:PATH"
        go version
        go env
    
    - name: Run Tests
      run: go test -v ./...
    
    - name: Build Project
      run: go build
    
    - name: Generate Version
      id: version
      run: |
        # Check if there's a previous tag/version
        git fetch --tags
        $LAST_TAG = $(git tag -l "v*" | Sort-Object -Property {[version]::new($_.TrimStart("v").PadRight(8,'0'))} -Descending | Select-Object -First 1)
        
        # If no previous tag exists, start with v0.0.1
        if ([string]::IsNullOrEmpty($LAST_TAG)) {
          $VERSION="v0.0.1"
        } else {
          # Extract version components
          $COMPONENTS = $LAST_TAG.TrimStart("v").Split(".")
          $MAJOR = [int]$COMPONENTS[0]
          $MINOR = [int]$COMPONENTS[1]
          $PATCH = [int]$COMPONENTS[2]
          
          # Increment PATCH
          $PATCH++
          
          # If PATCH > 9, increment MINOR and reset PATCH
          if ($PATCH -gt 9) {
            $MINOR++
            $PATCH = 0
          }
          
          # If MINOR > 9, increment MAJOR and reset MINOR
          if ($MINOR -gt 9) {
            $MAJOR++
            $MINOR = 0
          }
          
          $VERSION = "v$MAJOR.$MINOR.$PATCH"
        }
        
        echo "VERSION=$VERSION" >> $env:GITHUB_OUTPUT
        echo "Version: $VERSION"
    
    - name: Create Archive
      run: |
        $VERSION="${{ steps.version.outputs.VERSION }}"
        
        # Create zip file with requested format: god_of_war_browser-v0.1.0.zip
        $FILENAME="god_of_war_browser-$VERSION.zip"
        
        # Ensure the web folder is included in the artifact
        $REPO_DIR = $(Get-Location)
        Write-Host "Current directory: $REPO_DIR"
        
        if (Test-Path "web") {
          Write-Host "Web folder found in current directory"
          7z a "$FILENAME" -r web -x!*.go
        } elseif (Test-Path "c:\gopath\src\github.com\mogaika\god_of_war_browser\web") {
          Write-Host "Web folder found in gopath"
          7z a "$FILENAME" -r c:\gopath\src\github.com\mogaika\god_of_war_browser\web -x!*.go
        } else {
          Write-Host "Web folder not found directly. Attempting to get from repository..."
          
          if (-Not (Test-Path "$REPO_DIR\web")) {
            New-Item -ItemType Directory -Path "$REPO_DIR\web" -Force
            
            try {
              git clone --depth=1 --filter=blob:none --sparse https://github.com/mogaika/god_of_war_browser.git temp-repo
              cd temp-repo
              git sparse-checkout set web
              Copy-Item -Path "web\*" -Destination "$REPO_DIR\web" -Recurse -Force
              cd $REPO_DIR
              Remove-Item -Path "temp-repo" -Recurse -Force
              
              7z a "$FILENAME" -r web -x!*.go
              Write-Host "Web folder successfully obtained from repository"
            } catch {
              Write-Error "Unable to get web folder: $_"
              exit 1
            }
          } else {
            Write-Error "Web directory not found in any expected location"
            exit 1
          }
        }
        
        # Add other files to the zip
        7z a "$FILENAME" god_of_war_browser.exe
        7z a "$FILENAME" font_aliases.cfg
        7z a "$FILENAME" font_aliases.ru.cp1251.cfg
        7z a "$FILENAME" LOCALIZATION.md
        7z a "$FILENAME" README.md
        7z a "$FILENAME" hashes.dump.txt
        7z a "$FILENAME" strings.dump.txt
        
        echo "ARCHIVE_PATH=$FILENAME" >> $env:GITHUB_ENV
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: god_of_war_browser-${{ steps.version.outputs.VERSION }}
        path: ${{ env.ARCHIVE_PATH }}
    
    - name: Tag Version
      if: github.ref == 'refs/heads/main'
      run: |
        # Configure git for creating a new tag
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git tag ${{ steps.version.outputs.VERSION }}
        git push origin ${{ steps.version.outputs.VERSION }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        name: God of War Browser ${{ steps.version.outputs.VERSION }}
        body: |
          God of War Browser ${{ steps.version.outputs.VERSION }}
          
          Commit: [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          Build: ${{ github.run_number }}
          Date: ${{ github.event.head_commit.timestamp }}
        files: ${{ env.ARCHIVE_PATH }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Notify Success on Discord
      if: success()
      run: |
        Invoke-RestMethod https://raw.githubusercontent.com/DiscordHooks/appveyor-discord-webhook/master/send.ps1 -OutFile send.ps1
        ./send.ps1 success ${{ secrets.WEBHOOK_URL }}
    
    - name: Notify Failure on Discord
      if: failure()
      run: |
        Invoke-RestMethod https://raw.githubusercontent.com/DiscordHooks/appveyor-discord-webhook/master/send.ps1 -OutFile send.ps1
        ./send.ps1 failure ${{ secrets.WEBHOOK_URL }}
