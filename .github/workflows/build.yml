name: Build and Deploy
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:  # Permite execução manual

jobs:
  build:
    runs-on: windows-latest
    env:
      GOPATH: C:\gopath
      GOARCH: 386
      GOOS: windows
      CGO_ENABLED: 0
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.20'
        cache: true
    
    - name: Verify environment
      run: |
        echo "PATH: $env:PATH"
        echo "GOPATH: $env:GOPATH"
        $env:PATH = "$env:GOPATH\bin;C:\go\bin;$env:PATH"
        go version
        go env
    
    - name: Run Tests
      run: go test -v ./...
    
    - name: Build Project
      run: go build
    
    - name: Generate Version
      id: version
      run: |
        # Check if workflow was triggered by a tag
        if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
          # Use the tag as version
          $VERSION = "${{ github.ref }}".Replace("refs/tags/", "")
        } else {
          # Check if there's a previous tag/version
          git fetch --tags
          $LAST_TAG = $(git tag -l "v*" | Sort-Object -Property {[version]::new($_.TrimStart("v").PadRight(8,'0'))} -Descending | Select-Object -First 1)
          
          # If no previous tag exists, start with v0.0.1
          if ([string]::IsNullOrEmpty($LAST_TAG)) {
            $VERSION="v0.0.1"
          } else {
            # Extract version components
            $COMPONENTS = $LAST_TAG.TrimStart("v").Split(".")
            $MAJOR = [int]$COMPONENTS[0]
            $MINOR = [int]$COMPONENTS[1]
            $PATCH = [int]$COMPONENTS[2]
            
            # Increment PATCH
            $PATCH++
            
            # If PATCH > 9, increment MINOR and reset PATCH
            if ($PATCH -gt 9) {
              $MINOR++
              $PATCH = 0
            }
            
            # If MINOR > 9, increment MAJOR and reset MINOR
            if ($MINOR -gt 9) {
              $MAJOR++
              $MINOR = 0
            }
            
            $VERSION = "v$MAJOR.$MINOR.$PATCH"
          }
        }
        
        echo "VERSION=$VERSION" >> $env:GITHUB_OUTPUT
        echo "Generated version: $VERSION"
    
    - name: Verify required files
      run: |
        $REQUIRED_FILES = @(
          "god_of_war_browser.exe",
          "web",
          "font_aliases.cfg",
          "font_aliases.ru.cp1251.cfg"
        )
        
        $MISSING_FILES = @()
        
        foreach ($FILE in $REQUIRED_FILES) {
          if (-Not (Test-Path $FILE)) {
            $MISSING_FILES += $FILE
          }
        }
        
        if ($MISSING_FILES.Count -gt 0) {
          Write-Error "Missing required files: $($MISSING_FILES -join ', ')"
          exit 1
        } else {
          Write-Host "All required files verified successfully"
        }
    
    - name: Create Archive
      run: |
        $VERSION="${{ steps.version.outputs.VERSION }}"
        
        # Create zip file with requested format
        $FILENAME="god_of_war_browser-$VERSION.zip"
        
        # Create the archive with all required files
        7z a "$FILENAME" -r web -x!*.go
        7z a "$FILENAME" god_of_war_browser.exe
        7z a "$FILENAME" font_aliases.cfg
        7z a "$FILENAME" font_aliases.ru.cp1251.cfg
        
        # Add optional files if they exist
        $OPTIONAL_FILES = @(
          "LOCALIZATION.md",
          "README.md",
          "hashes.dump.txt",
          "strings.dump.txt"
        )
        
        foreach ($FILE in $OPTIONAL_FILES) {
          if (Test-Path $FILE) {
            7z a "$FILENAME" $FILE
            Write-Host "Added optional file: $FILE"
          }
        }
        
        echo "ARCHIVE_PATH=$FILENAME" >> $env:GITHUB_ENV
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: god_of_war_browser-${{ steps.version.outputs.VERSION }}
        path: ${{ env.ARCHIVE_PATH }}
        retention-days: 30
    
    - name: Tag Version
      if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch'
      run: |
        # Configure git for creating a new tag
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git tag ${{ steps.version.outputs.VERSION }}
        git push origin ${{ steps.version.outputs.VERSION }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        name: God of War Browser ${{ steps.version.outputs.VERSION }}
        body: |
          God of War Browser ${{ steps.version.outputs.VERSION }}
          
          Commit: [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          Build: ${{ github.run_number }}
          Date: ${{ github.event.head_commit.timestamp }}
        files: ${{ env.ARCHIVE_PATH }}
        draft: false
        prerelease: false
        make_latest: true  # Marca cada nova release como "latest"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Notify Success on Discord
      if: success()
      run: |
        Invoke-RestMethod https://raw.githubusercontent.com/DiscordHooks/appveyor-discord-webhook/master/send.ps1 -OutFile send.ps1
        ./send.ps1 success ${{ secrets.WEBHOOK_URL }}
    
    - name: Notify Failure on Discord
      if: failure()
      run: |
        Invoke-RestMethod https://raw.githubusercontent.com/DiscordHooks/appveyor-discord-webhook/master/send.ps1 -OutFile send.ps1
        ./send.ps1 failure ${{ secrets.WEBHOOK_URL }}
